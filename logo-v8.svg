<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80">
  <defs>
    <linearGradient id="g8a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="50%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g8b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow8">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone: Infinito Tech / Loop -->
  <g transform="translate(5, 15)">
    <!-- Símbolo do infinito estilizado -->
    <path d="M15 25 C15 10, 30 10, 35 25 C40 40, 55 40, 55 25 C55 10, 40 10, 35 25 C30 40, 15 40, 15 25"
          fill="none" stroke="url(#g8a)" stroke-width="4" stroke-linecap="round"/>

    <!-- Pontos de energia -->
    <circle cx="15" cy="25" r="4" fill="#f59e0b" filter="url(#glow8)"/>
    <circle cx="35" cy="25" r="5" fill="#ef4444" filter="url(#glow8)"/>
    <circle cx="55" cy="25" r="4" fill="#8b5cf6" filter="url(#glow8)"/>

    <!-- Partículas ao redor -->
    <circle cx="5" cy="15" r="2" fill="#f59e0b" opacity="0.6"/>
    <circle cx="65" cy="35" r="2" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="35" cy="5" r="2" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- Texto -->
  <text x="85" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-1">
    <tspan fill="url(#g8a)">LS</tspan> GLOBAL
  </text>
  <text x="85" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="url(#g8b)" letter-spacing="5">TECNOLOGIA</text>
</svg>