<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80">
  <defs>
    <linearGradient id="g9a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="g9b" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone: Escudo Digital / Shield -->
  <g transform="translate(8, 6)">
    <!-- Escudo externo -->
    <path d="M30 0 L55 10 L55 35 C55 50 30 62 30 62 C30 62 5 50 5 35 L5 10 Z"
          fill="none" stroke="url(#g9a)" stroke-width="2.5"/>

    <!-- Escudo interno -->
    <path d="M30 10 L47 17 L47 33 C47 43 30 52 30 52 C30 52 13 43 13 33 L13 17 Z"
          fill="rgba(6, 182, 212, 0.1)" stroke="url(#g9b)" stroke-width="1.5"/>

    <!-- Check de segurança -->
    <path d="M22 32 L28 38 L40 24" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow9)"/>

    <!-- Pontos nos cantos -->
    <circle cx="30" cy="0" r="3" fill="#06b6d4" filter="url(#glow9)"/>
    <circle cx="55" cy="10" r="2" fill="#3b82f6"/>
    <circle cx="5" cy="10" r="2" fill="#8b5cf6"/>
  </g>

  <!-- Texto -->
  <text x="78" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff" letter-spacing="1">
    <tspan fill="url(#g9a)">LS</tspan> GLOBAL
  </text>
  <rect x="78" y="40" width="140" height="2" fill="url(#g9a)" rx="1"/>
  <text x="78" y="58" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="500" fill="#64748b" letter-spacing="6">TECNOLOGIA</text>
</svg>