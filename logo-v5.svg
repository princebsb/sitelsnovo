<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70">
  <defs>
    <linearGradient id="g5a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone: Triângulo/Seta tecnológica -->
  <g transform="translate(5, 5)">
    <!-- Triângulo externo -->
    <polygon points="30,2 58,52 2,52" fill="none" stroke="url(#g5a)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Triângulo interno invertido -->
    <polygon points="30,20 44,44 16,44" fill="none" stroke="url(#g5a)" stroke-width="1.5" stroke-linejoin="round" opacity="0.6"/>

    <!-- Linhas de conexão -->
    <line x1="30" y1="2" x2="30" y2="20" stroke="url(#g5a)" stroke-width="1.5"/>
    <line x1="2" y1="52" x2="16" y2="44" stroke="url(#g5a)" stroke-width="1.5"/>
    <line x1="58" y1="52" x2="44" y2="44" stroke="url(#g5a)" stroke-width="1.5"/>

    <!-- Pontos nos vértices -->
    <circle cx="30" cy="2" r="4" fill="#6366f1" filter="url(#glow5)"/>
    <circle cx="2" cy="52" r="4" fill="#8b5cf6" filter="url(#glow5)"/>
    <circle cx="58" cy="52" r="4" fill="#06b6d4" filter="url(#glow5)"/>

    <!-- LS no centro -->
    <text x="30" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">LS</text>
  </g>

  <!-- Texto -->
  <text x="75" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="url(#g5a)" letter-spacing="0">LS</text>
  <text x="105" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="400" fill="#ffffff" letter-spacing="2">GLOBAL</text>
  <text x="75" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="300" fill="#71717a" letter-spacing="5">TECNOLOGIA</text>
</svg>