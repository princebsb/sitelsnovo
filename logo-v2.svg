<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70">
  <defs>
    <!-- Gradiente principal -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <!-- Gradiente vertical -->
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>

    <!-- Brilho -->
    <filter id="glow2">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone Hexagonal Tech -->
  <g transform="translate(8, 7)">
    <!-- Hexágono externo -->
    <polygon points="28,0 56,16 56,48 28,64 0,48 0,16" fill="none" stroke="url(#grad1)" stroke-width="2"/>

    <!-- Hexágono interno -->
    <polygon points="28,12 44,22 44,42 28,52 12,42 12,22" fill="none" stroke="url(#grad2)" stroke-width="1.5" opacity="0.7"/>

    <!-- Conexões de rede -->
    <line x1="28" y1="0" x2="28" y2="12" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="28" y1="52" x2="28" y2="64" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="0" y1="16" x2="12" y2="22" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="44" y1="22" x2="56" y2="16" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="0" y1="48" x2="12" y2="42" stroke="url(#grad1)" stroke-width="1.5"/>
    <line x1="44" y1="42" x2="56" y2="48" stroke="url(#grad1)" stroke-width="1.5"/>

    <!-- Centro - LS estilizado -->
    <text x="28" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="800" fill="url(#grad1)" text-anchor="middle" filter="url(#glow2)">LS</text>

    <!-- Pontos nos vértices -->
    <circle cx="28" cy="0" r="3" fill="#06b6d4" filter="url(#glow2)"/>
    <circle cx="56" cy="16" r="3" fill="#6366f1" filter="url(#glow2)"/>
    <circle cx="56" cy="48" r="3" fill="#8b5cf6" filter="url(#glow2)"/>
    <circle cx="28" cy="64" r="3" fill="#06b6d4" filter="url(#glow2)"/>
    <circle cx="0" cy="48" r="3" fill="#6366f1" filter="url(#glow2)"/>
    <circle cx="0" cy="16" r="3" fill="#8b5cf6" filter="url(#glow2)"/>
  </g>

  <!-- Texto GLOBAL -->
  <text x="80" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="2">GLOBAL</text>

  <!-- Texto TECNOLOGIA -->
  <text x="80" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="url(#grad1)" letter-spacing="5">TECNOLOGIA</text>

  <!-- Linha decorativa -->
  <line x1="80" y1="40" x2="200" y2="40" stroke="url(#grad1)" stroke-width="1" opacity="0.5"/>
</svg>