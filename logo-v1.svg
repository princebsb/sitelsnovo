<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <!-- Gradiente principal -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>

    <!-- Gradiente para o globo -->
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>

    <!-- Brilho -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone do Globo Estilizado -->
  <g transform="translate(10, 8)">
    <!-- Círculo externo do globo -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="url(#mainGradient)" stroke-width="2.5"/>

    <!-- Meridianos -->
    <ellipse cx="32" cy="32" rx="12" ry="28" fill="none" stroke="url(#globeGradient)" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="32" cy="32" rx="22" ry="28" fill="none" stroke="url(#globeGradient)" stroke-width="1.2" opacity="0.6"/>

    <!-- Linha do equador -->
    <ellipse cx="32" cy="32" rx="28" ry="10" fill="none" stroke="url(#mainGradient)" stroke-width="1.5" opacity="0.8"/>

    <!-- Paralelos -->
    <ellipse cx="32" cy="20" rx="22" ry="6" fill="none" stroke="url(#globeGradient)" stroke-width="1" opacity="0.5"/>
    <ellipse cx="32" cy="44" rx="22" ry="6" fill="none" stroke="url(#globeGradient)" stroke-width="1" opacity="0.5"/>

    <!-- Pontos de conexão (nós tecnológicos) -->
    <circle cx="32" cy="4" r="3" fill="url(#mainGradient)" filter="url(#glow)"/>
    <circle cx="32" cy="60" r="3" fill="url(#mainGradient)" filter="url(#glow)"/>
    <circle cx="4" cy="32" r="3" fill="url(#globeGradient)" filter="url(#glow)"/>
    <circle cx="60" cy="32" r="3" fill="url(#globeGradient)" filter="url(#glow)"/>

    <!-- Órbita tecnológica -->
    <circle cx="32" cy="32" r="35" fill="none" stroke="url(#mainGradient)" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

    <!-- Ponto orbital -->
    <circle cx="62" cy="18" r="4" fill="url(#mainGradient)" filter="url(#glow)"/>
  </g>

  <!-- Texto LS -->
  <text x="88" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="url(#mainGradient)" letter-spacing="-1">LS</text>

  <!-- Texto GLOBAL -->
  <text x="132" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="32" font-weight="300" fill="#ffffff" letter-spacing="1">GLOBAL</text>

  <!-- Linha separadora -->
  <rect x="88" y="46" width="180" height="1.5" fill="url(#mainGradient)" rx="1"/>

  <!-- Texto TECNOLOGIA -->
  <text x="88" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" fill="#a1a1aa" letter-spacing="6">TECNOLOGIA</text>
</svg>