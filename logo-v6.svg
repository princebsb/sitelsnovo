<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70">
  <defs>
    <linearGradient id="g6a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="g6b" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone: Anéis orbitais / Átomo -->
  <g transform="translate(8, 7)">
    <!-- Núcleo central -->
    <circle cx="28" cy="28" r="10" fill="url(#g6a)" filter="url(#glow6)"/>
    <text x="28" y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">LS</text>

    <!-- Órbitas -->
    <ellipse cx="28" cy="28" rx="26" ry="10" fill="none" stroke="url(#g6a)" stroke-width="1.5" transform="rotate(-30 28 28)"/>
    <ellipse cx="28" cy="28" rx="26" ry="10" fill="none" stroke="url(#g6b)" stroke-width="1.5" transform="rotate(30 28 28)"/>
    <ellipse cx="28" cy="28" rx="26" ry="10" fill="none" stroke="url(#g6a)" stroke-width="1.5" transform="rotate(90 28 28)" opacity="0.5"/>

    <!-- Elétrons -->
    <circle cx="52" cy="20" r="3" fill="#06b6d4" filter="url(#glow6)"/>
    <circle cx="8" cy="40" r="3" fill="#8b5cf6" filter="url(#glow6)"/>
    <circle cx="28" cy="2" r="3" fill="#6366f1" filter="url(#glow6)"/>
  </g>

  <!-- Texto principal grande -->
  <text x="78" y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="1">
    <tspan fill="url(#g6a)">LS</tspan> GLOBAL
  </text>

  <!-- Subtítulo -->
  <text x="78" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="url(#g6a)" letter-spacing="7">TECNOLOGIA</text>
</svg>