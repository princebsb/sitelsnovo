<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70">
  <defs>
    <linearGradient id="g7a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="g7b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow7">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone: Cubo 3D / Blockchain -->
  <g transform="translate(8, 8)">
    <!-- Face frontal -->
    <polygon points="28,20 48,32 48,52 28,40 8,52 8,32" fill="none" stroke="url(#g7a)" stroke-width="2"/>

    <!-- Face superior -->
    <polygon points="28,0 48,12 28,20 8,12" fill="none" stroke="url(#g7b)" stroke-width="2"/>

    <!-- Arestas verticais -->
    <line x1="28" y1="20" x2="28" y2="40" stroke="url(#g7a)" stroke-width="1.5"/>
    <line x1="8" y1="12" x2="8" y2="32" stroke="url(#g7a)" stroke-width="1.5" opacity="0.5"/>
    <line x1="48" y1="12" x2="48" y2="32" stroke="url(#g7a)" stroke-width="1.5" opacity="0.5"/>

    <!-- Pontos nos vértices -->
    <circle cx="28" cy="0" r="3" fill="#6366f1" filter="url(#glow7)"/>
    <circle cx="48" cy="12" r="3" fill="#8b5cf6" filter="url(#glow7)"/>
    <circle cx="8" cy="12" r="3" fill="#06b6d4" filter="url(#glow7)"/>
    <circle cx="28" cy="40" r="3" fill="#06b6d4" filter="url(#glow7)"/>

    <!-- LS dentro do cubo -->
    <text x="28" y="35" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle" opacity="0.9">LS</text>
  </g>

  <!-- Texto estilo moderno -->
  <g transform="translate(72, 0)">
    <text x="0" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="url(#g7a)" letter-spacing="3">LS</text>
    <text x="30" y="26" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#71717a" letter-spacing="2">GLOBAL</text>

    <rect x="0" y="32" width="100" height="3" fill="url(#g7a)" rx="1.5"/>

    <text x="0" y="54" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-1">TECNOLOGIA</text>
  </g>
</svg>