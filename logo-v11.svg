<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80">
  <defs>
    <linearGradient id="g11a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="g11b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow11">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ícone: Diamante / Cristal Tech -->
  <g transform="translate(8, 5)">
    <!-- Diamante principal -->
    <polygon points="30,0 55,22 30,65 5,22" fill="none" stroke="url(#g11a)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Facetas internas -->
    <line x1="30" y1="0" x2="30" y2="65" stroke="url(#g11a)" stroke-width="1" opacity="0.5"/>
    <line x1="5" y1="22" x2="55" y2="22" stroke="url(#g11a)" stroke-width="1.5"/>
    <line x1="30" y1="0" x2="5" y2="22" stroke="url(#g11a)" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="0" x2="55" y2="22" stroke="url(#g11a)" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="65" x2="18" y2="22" stroke="url(#g11a)" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="65" x2="42" y2="22" stroke="url(#g11a)" stroke-width="1" opacity="0.4"/>

    <!-- Brilhos -->
    <circle cx="30" cy="0" r="4" fill="#ec4899" filter="url(#glow11)"/>
    <circle cx="55" cy="22" r="3" fill="#8b5cf6" filter="url(#glow11)"/>
    <circle cx="5" cy="22" r="3" fill="#6366f1" filter="url(#glow11)"/>
    <circle cx="30" cy="65" r="4" fill="#06b6d4" filter="url(#glow11)"/>

    <!-- Centro luminoso -->
    <circle cx="30" cy="28" r="6" fill="url(#g11a)" opacity="0.3" filter="url(#glow11)"/>
  </g>

  <!-- Texto estilo premium -->
  <text x="78" y="28" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="300" fill="#a1a1aa" letter-spacing="8">LS</text>
  <text x="78" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="1">GLOBAL</text>
  <text x="78" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="url(#g11a)" letter-spacing="5">TECNOLOGIA</text>
</svg>